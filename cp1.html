<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELP ME</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:url('bg1.jpg') center/cover no-repeat;
    min-height:100vh;
    margin:0;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.game{
    max-width:1200px;
    width:95%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(5px);
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.2);
}
.hint,.lesson{
    background:white;
    color:black;
    padding:15px;
    border-radius:12px;
}
#cryptogram{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    justify-content:center;
    margin:20px 0;
}
.box{
    display:flex;
    flex-direction:column;
    align-items:center;
}
.letter{
    width:55px;
    height:55px;
    font-size:30px;
    text-align:center;
    font-weight:bold;
    text-transform:uppercase;
}
.number{
    background:#111;
    color:gold;
    padding:4px 8px;
    border-radius:8px;
    margin-top:5px;
}
.space{
    width:20px;
}
button{
    padding:10px 18px;
    font-size:18px;
    cursor:pointer;
}
#lives{
    font-size:40px;
    text-align:center;
    margin:10px 0;
}
#msg{
    text-align:center;
    margin-top:15px;
    font-size:20px;
}
#puzzle{
    display:none;
    text-align:center;
    margin-top:20px;
}
/* === 3×3 PUZZLE BOARD === */
.board{
    width:300px;
    height:300px;
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(3, 100px);
    grid-template-rows:repeat(3, 100px);
    gap:2px;
}
.piece{
    width:100px;
    height:100px;
    border:2px solid white;
    cursor:pointer;
    background-image:url('pz1.jpg');
    background-size:300px 300px;
    transition:.2s;
}
.piece:hover{
    transform:scale(1.05);
}
/* VIDEO — appears only at end */
#videoBox{
    display:none;
    text-align:center;
    margin-top:40px;
    padding:20px;
    background:rgba(0,0,0,0.2);
    border-radius:15px;
}
video{
    width:100%;
    max-width:600px;
    border-radius:10px;
}
.level-nav{
    text-align:center;
    margin-bottom:15px;
}
.level-nav button{
    background:rgba(255,255,255,0.2);
    color:white;
    border:none;
    border-radius:8px;
    margin:0 5px;
}
.level-nav button.active{
    background:#00c2ff;
    font-weight:bold;
}
</style>
</head>
<body>
<div class="game">
<h1>🔐 HELP ME</h1>
<div class="level-nav">
    <button onclick="loadLevel(1)" id="btn1">Level 1</button>
    <button onclick="loadLevel(2)" id="btn2">Level 2</button>
    <button onclick="loadLevel(3)" id="btn3">Level 3</button>
</div>
<div class="hint" id="hintBox"></div>
<div id="lives">❤️❤️❤️</div>
<div id="cryptogram"></div>
<div style="text-align:center">
    <button onclick="checkAnswer()">CHECK ANSWER</button>
</div>
<div id="msg"></div>
<div id="lesson" class="lesson" style="display:none"></div>
<!-- NEXT LEVEL BUTTON -->
<div style="text-align:center; margin-top:20px;">
    <button id="nextBtn" onclick="goNext()" style="display:none; background:#00c2ff; color:white; border:none; border-radius:10px;">
        ➡️ NEXT LEVEL
    </button>
</div>
<!-- RECOVERY PUZZLE — 3×3 Grid -->
<div id="puzzle">
    <h2>🧩 Recovery Puzzle</h2>
    <p>Click two pieces to swap them. Arrange the picture correctly to earn another chance!</p>
    <div class="board" id="board"></div>
</div>
<!-- VIDEO — appears ONLY after Level 3 -->
<div id="videoBox">
    <h3>🎉 All Levels Complete! 📹 Lesson Video</h3>
    <video width="600" controls>
        <source src="vid1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <br><br>
    <button onclick="nextPage()">
        ➡️ CONTINUE
    </button>
</div>
</div>
<script>
/* === ALL 3 LEVEL DATA === */
const levels = [
    {
        answer: "ENVIRONMENT HEALTH",
        hint: "It refers to the branch of public health that focuses on how the environment affects people's health and well-being.",
        lesson: `
        <h2>🌍 Environmental Health</h2>
        <p>
        Environmental Health is the branch of public health that focuses on how the environment affects human health and well-being. It involves identifying, assessing, and controlling environmental factors that may affect health.
        </p>
        <p>
        These environmental factors include air quality, water quality, food safety, sanitation, waste management, housing conditions, climate change, and exposure to harmful chemicals. Environmental health aims to create safe, clean, and healthy surroundings where people can live, learn, work, and play.
        </p>
        <h3>⭐ Why is Environmental Health Important?</h3>
        <ul>
            <li>Prevents diseases caused by pollution and environmental hazards.</li>
            <li>Ensures access to clean air and safe drinking water.</li>
            <li>Promotes proper sanitation and waste disposal.</li>
            <li>Protects people from harmful chemicals and toxins.</li>
            <li>Reduces the spread of infectious diseases.</li>
            <li>Creates healthier homes, schools, and communities.</li>
            <li>Improves quality of life and overall well-being.</li>
            <li>Supports sustainable development for future generations.</li>
        </ul>
        <h3>🌱 Examples of Environmental Health Practices</h3>
        <ul>
            <li>Proper waste segregation and disposal.</li>
            <li>Keeping surroundings clean.</li>
            <li>Reducing air and water pollution.</li>
            <li>Planting trees and protecting natural resources.</li>
            <li>Conserving water and energy.</li>
            <li>Maintaining proper hygiene and sanitation.</li>
        </ul>
        <p>
        Environmental Health is everyone's responsibility. By protecting our environment, we also protect our health and the health of future generations.
        </p>
        `
    },
    {
        answer: "PERSONAL HEALTH",
        hint: "It refers to the practice of taking care of oneself to stay healthy, fit, and free from illness.",
        lesson: `
        <h2>🧑 Personal Health</h2>
        <p>
        Personal Health refers to the well-being of an individual. It involves taking responsibility for your own health through proper habits, lifestyle choices, and self-care. It covers physical, mental, emotional, and social well-being.
        </p>
        <h3>⭐ Components of Personal Health</h3>
        <ul>
            <li><strong>Physical Health:</strong> Healthy body through nutrition, exercise, rest, and hygiene.</li>
            <li><strong>Mental Health:</strong> Clear thinking, learning, and making good decisions.</li>
            <li><strong>Emotional Health:</strong> Understanding feelings, coping with stress, and staying positive.</li>
            <li><strong>Social Health:</strong> Getting along well with others and building good relationships.</li>
        </ul>
        <h3>✅ Ways to Maintain Good Personal Health</h3>
        <ul>
            <li>Eating nutritious and balanced meals.</li>
            <li>Getting enough sleep and rest.</li>
            <li>Exercising regularly and staying active.</li>
            <li>Keeping good personal hygiene (bathing, brushing teeth, washing hands).</li>
            <li>Avoiding harmful substances like tobacco, alcohol, and drugs.</li>
            <li>Managing stress and staying happy.</li>
            <li>Keeping your body clean and free from germs.</li>
        </ul>
        <p>
        Personal health begins with YOU. When you take good care of yourself, you stay strong, happy, and ready to learn and help others.
        </p>
        `
    },
    {
        answer: "COMMUNITY HEALTH",
        hint: "It deals with the health status and conditions of a whole group of people living together in the same area.",
        lesson: `
        <h2>🏘️ Community Health</h2>
        <p>
        Community Health refers to the health status of the people living in the same area or society. It includes the efforts made to protect and improve the health of the entire community rather than just one person.
        </p>
        <p>
        A healthy community provides clean water, safe food, proper waste disposal, good schools, health services, and a safe environment for everyone.
        </p>
        <h3>⭐ Characteristics of a Healthy Community</h3>
        <ul>
            <li>Clean and safe physical environment.</li>
            <li>Access to clean and safe drinking water.</li>
            <li>Proper waste management and sanitation.</li>
            <li>Accessible health services and hospitals.</li>
            <li>Peaceful and orderly surroundings.</li>
            <li>Active community participation and unity.</li>
            <li>Availability of nutritious food and adequate housing.</li>
            <li>Protection from diseases and hazards.</li>
        </ul>
        <h3>🤝 Your Role in Community Health</h3>
        <ul>
            <li>Keep your home and surroundings clean.</li>
            <li>Segregate trash and dispose waste properly.</li>
            <li>Help maintain cleanliness in public places.</li>
            <li>Follow health rules and guidelines.</li>
            <li>Join community clean-up and health programs.</li>
            <li>Help neighbors and work together as one community.</li>
        </ul>
        <p>
        Community health is everybody's concern. When everyone helps and cooperates, the whole community becomes a healthy, safe, and happy place to live!
        </p>
        `
    }
];
let currentLevel = 1;
let answer = "";
let lives = 3;
// 3×3 puzzle — 9 pieces, shuffled starting order
let order = [4, 7, 1, 6, 3, 8, 0, 5, 2];
let selected = null;
function num(c){
    return c.charCodeAt(0) - 64;
}
function nextPage(){
    window.location.href = "cp2.html";
}
/* === LOAD SELECTED LEVEL === */
function loadLevel(n){
    currentLevel = n;
    const lvl = levels[n-1];
    answer = lvl.answer;
    lives = 3;
    // Reset puzzle to shuffled 3×3 order
    order = [4, 7, 1, 6, 3, 8, 0, 5, 2];
    selected = null;
    // Reset all displays
    document.getElementById('hintBox').innerHTML = `<b>Hint:</b> ${lvl.hint}`;
    document.getElementById('msg').innerHTML = "";
    document.getElementById('lesson').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('puzzle').style.display = 'none';
    document.getElementById('videoBox').style.display = 'none';
    document.getElementById('board').innerHTML = "";
    updateLives();
    draw();
    // Highlight active level button
    for(let i=1; i<=3; i++){
        document.getElementById(`btn${i}`).classList.toggle('active', i===n);
    }
}
/* === DRAW CRYPTOGRAM INPUTS === */
function draw(){
    let html='';
    for(let c of answer){
        if(c===' '){
            html += '<div class="space"></div>';
        }
        else{
            html += `
            <div class="box">
                <input maxlength="1" class="letter" data-answer="${c}">
                <div class="number">${num(c)}</div>
            </div>`;
        }
    }
    document.getElementById('cryptogram').innerHTML = html;
    const allInputs = document.querySelectorAll('.letter');
    allInputs.forEach((input, index)=>{
        input.addEventListener('input', function(){
            if(lives <= 0) return;
            let typed = this.value.toUpperCase();
            let correct = this.dataset.answer;
            this.value = typed;
            if(typed === correct){
                // ✅ CORRECT → auto move to next box
                if(index + 1 < allInputs.length){
                    allInputs[index + 1].focus();
                }
            }
            else if(typed && typed !== correct){
                lives--;
                updateLives();
                document.getElementById('msg').innerHTML = '❌ Wrong letter!';
                this.value = '';
                if(lives <= 0){
                    showPuzzle();
                }
            }
        });
    });
}
function updateLives(){
    document.getElementById('lives').innerHTML = '❤️'.repeat(lives);
}
/* === CHECK ANSWER === */
function checkAnswer(){
    if(lives <= 0) return;
    let inputs = [...document.querySelectorAll('.letter')];
    let idx = 0;
    let userAnswer = '';
    for(let c of answer){
        if(c === ' '){
            userAnswer += ' ';
        }
        else{
            userAnswer += (inputs[idx++].value || '').toUpperCase();
        }
    }
    if(userAnswer === answer){
        const lvl = levels[currentLevel-1];
        document.getElementById('msg').innerHTML = `✅ Correct! ${answer}`;
        document.getElementById('lesson').style.display = 'block';
        document.getElementById('lesson').innerHTML = lvl.lesson;
        if(currentLevel < 3){
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            // SHOW VIDEO after completing Level 3
            document.getElementById('videoBox').style.display = 'block';
            document.getElementById('videoBox').scrollIntoView({behavior:'smooth'});
        }
    }
    else{
        document.getElementById('msg').innerHTML = '⚠️ Keep filling in the correct letters.';
    }
}
/* === NEXT LEVEL BUTTON === */
function goNext(){
    if(currentLevel < 3){
        loadLevel(currentLevel + 1);
    }
}
/* === 3×3 RECOVERY PUZZLE === */
function showPuzzle(){
    document.getElementById("puzzle").style.display = "block";
    renderPuzzle();
    document.getElementById("puzzle").scrollIntoView({behavior:'smooth'});
}
function renderPuzzle(){
    const board = document.getElementById("board");
    board.innerHTML = "";
    // 3×3 positions: 0,0 → 2,2
    const positions = [
        [0,0],[1,0],[2,0],
        [0,1],[1,1],[2,1],
        [0,2],[1,2],[2,2]
    ];
    order.forEach((piece,index)=>{
        const div = document.createElement("div");
        div.className = "piece";
        div.style.backgroundPosition =
            `${-positions[piece][0]*100}px ${-positions[piece][1]*100}px`;
        div.onclick = () => swapPiece(index);
        board.appendChild(div);
    });
}
function swapPiece(index){
    if(selected === null){
        selected = index;
        return;
    }
    // Swap selected piece with clicked piece
    [order[selected], order[index]] = [order[index], order[selected]];
    selected = null;
    renderPuzzle();
    // Correct order: 0,1,2,3,4,5,6,7,8
    if(order.join(",") === "0,1,2,3,4,5,6,7,8"){
        lives = 3;
        updateLives();
        document.getElementById("msg").innerHTML =
            "🎉 Puzzle Solved! You earned another chance!";
        document.getElementById("puzzle").style.display = "none";
        // Reset puzzle order for next time
        order = [4, 7, 1, 6, 3, 8, 0, 5, 2];
        draw();
    }
}
// Start game at Level 1
loadLevel(1);
</script>
</body>
</html>

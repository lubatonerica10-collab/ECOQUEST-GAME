<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECOQUEST - Level 3 Map</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow-y:auto;
font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),
url("bg8.jpg");

background-size:cover;
background-position:center;

}

.title{

position:absolute;
top:20px;
width:100%;

text-align:center;

font-family:'Orbitron',sans-serif;

font-size:48px;

color:white;

text-shadow:
0 0 10px #7CFC00,
0 0 20px #32CD32;

}

.subtitle{

position:absolute;
top:85px;
width:100%;
text-align:center;
color:white;
font-size:22px;

}

.path{

position:absolute;
width:100%;
height:100%;

}

svg{

width:100%;
height:100%;

}

.level{

position:absolute;

width:110px;
height:110px;

border-radius:50%;

border:none;

cursor:pointer;

color:white;

font-size:38px;

transition:.3s;

box-shadow:0 0 25px rgba(0,0,0,.4);

}

.completed{

background:linear-gradient(#FFD700,#FBC02D);

}

.completed:hover{

transform:scale(1.08);

}

.current{

background:linear-gradient(#00c853,#64dd17);

animation:pulse 1.5s infinite;

}

.current:hover{

transform:scale(1.1);

}

@keyframes pulse{

0%{box-shadow:0 0 10px lime;}
50%{box-shadow:0 0 35px lime;}
100%{box-shadow:0 0 10px lime;}

}

.locked{

background:#777;
cursor:not-allowed;

}

#l1{
left:8%;
bottom:12%;
}

#l2{
left:28%;
top:62%;
}

#l3{
left:48%;
top:38%;
}

#l4{
left:68%;
top:56%;
}

#l5{
right:8%;
top:18%;
}

.label{

position:absolute;

color:white;

font-weight:bold;

text-align:center;

width:140px;

}

.lab1{left:6%;bottom:2%;}
.lab2{left:26%;top:78%;}
.lab3{left:46%;top:54%;}
.lab4{left:66%;top:72%;}
.lab5{right:5%;top:34%;}

.info{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

color:white;

font-size:18px;

}

</style>

</head>

<body>

<div class="title">
🌿 ECOQUEST MAP 🌿
</div>

<div class="subtitle">
Levels 1 & 2 Completed! Level 3 Unlocked!
</div>

<div class="path">

<svg>

<path

d="M120 700
Q250 560 420 520
Q610 360 790 430
Q950 520 1100 230"

stroke="#C8A165"

stroke-width="18"

fill="none"

stroke-linecap="round"

stroke-dasharray="20 15"/>

</svg>

</div>

<button
id="l1"
class="level completed">

✅

</button>

<div class="label lab1">
Forest Camp
<br>
Completed
</div>

<button
id="l2"
class="level completed">

✅

</button>

<div class="label lab2">
Air Quality
<br>
Completed
</div>

<button
id="l3"
class="level current"
onclick="location.href='level3.html'">

🏭

</button>

<div class="label lab3">
Factory Mission
<br>
Play
</div>

<button
id="l4"
class="level locked"
onclick="locked()">

🔒

</button>

<div class="label lab4">
Recycling
</div>

<button
id="l5"
class="level locked"
onclick="locked()">

🏆

</button>

<div class="label lab5">
Eco Guardian
</div>

<div class="info">

🌱 Great job! Click the glowing <b>Level 3</b> to continue your adventure.

</div>

<script>

function locked(){

alert("🔒 Complete the previous level and scan the next QR Code to unlock this mission.");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECOQUEST - Level 5 Map</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow-y:auto;
font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.30)),
url("bg10.jpg");

background-size:cover;
background-position:center;

}

.title{

position:absolute;
top:20px;
width:100%;

text-align:center;

font-family:'Orbitron',sans-serif;

font-size:48px;

color:white;

text-shadow:
0 0 10px #7CFC00,
0 0 20px #7CFC00,
0 0 40px #32CD32;

}

.subtitle{

position:absolute;
top:90px;
width:100%;

text-align:center;

font-size:22px;
color:white;

}

.path{

position:absolute;
width:100%;
height:100%;

}

svg{

width:100%;
height:100%;

}

.level{

position:absolute;

width:110px;
height:110px;

border:none;
border-radius:50%;

font-size:40px;

cursor:pointer;

color:white;

transition:.3s;

box-shadow:0 0 25px rgba(0,0,0,.4);

}

.completed{

background:linear-gradient(#FFD700,#FBC02D);

}

.completed:hover{

transform:scale(1.08);

}

.current{

background:linear-gradient(#00C853,#64DD17);

animation:pulse 1.5s infinite;

}

.current:hover{

transform:scale(1.1);

}

.locked{

background:#777;

cursor:not-allowed;

}

@keyframes pulse{

0%{
box-shadow:0 0 10px lime;
}

50%{
box-shadow:0 0 35px lime;
}

100%{
box-shadow:0 0 10px lime;
}

}

/* Button Positions */

#l1{

left:8%;
bottom:12%;

}

#l2{

left:26%;
top:66%;

}

#l3{

left:46%;
top:42%;

}

#l4{

left:66%;
top:60%;

}

#l5{

right:10%;
top:22%;

}

#l6{

right:2%;
top:3%;

}

/* Labels */

.label{

position:absolute;

width:140px;

text-align:center;

color:white;

font-weight:bold;

text-shadow:0 0 8px black;

}

.lab1{

left:6%;
bottom:2%;

}

.lab2{

left:24%;
top:82%;

}

.lab3{

left:44%;
top:58%;

}

.lab4{

left:64%;
top:76%;

}

.lab5{

right:8%;
top:38%;

}

.info{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

font-size:20px;

color:white;

text-shadow:0 0 10px black;

}

</style>

</head>

<body>

<div class="title">

🌍 ECOQUEST MAP 🌍

</div>

<div class="subtitle">

Level 5 - Eco Guardian Mission

</div>

<div class="path">

<svg>

<path

d="M120 700
Q260 560 420 500
Q620 350 800 430
Q960 540 1090 250
Q1170 130 1280 80"

stroke="#C8A165"

stroke-width="18"

fill="none"

stroke-linecap="round"

stroke-dasharray="20 15"/>

</svg>

</div>

<button
id="l1"
class="level completed">

✅

</button>

<div class="label lab1">

Green Village
<br>
Completed

</div>

<button
id="l2"
class="level completed">

✅

</button>

<div class="label lab2">

Hydro Dam
<br>
Completed

</div>

<button
id="l3"
class="level completed">

✅

</button>

<div class="label lab3">

Power Station
<br>
Completed

</div>

<button
id="l4"
class="level completed">

✅

</button>

<div class="label lab4">

Wind Turbines
<br>
Completed

</div>

<button
id="l5"
class="level current"
onclick="location.href='level5.html'">

🌍

</button>

<div class="label lab5">

Eco Guardian
<br>
Play

</div>


</button>

<div class="label lab6">

Eco Champion

</div>

<div class="info">

🌿 You have reached the final mission!<br>
Complete <b>Level 5</b> to unlock the <b>Eco Champion</b> title.

</div>

<script>

function locked(){

alert("🔒 Complete Level 5 to unlock the Eco Champion stage.");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECOQUEST - Level 4 Map</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow-y:auto;
font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.30)),
url("bg9.jpg");

background-size:cover;
background-position:center;

}

.title{

position:absolute;
top:20px;
width:100%;

text-align:center;

font-family:'Orbitron',sans-serif;

font-size:48px;

color:white;

text-shadow:
0 0 10px #00E5FF,
0 0 20px #00E5FF,
0 0 40px #00E5FF;

}

.subtitle{

position:absolute;
top:90px;
width:100%;

text-align:center;

font-size:22px;
color:white;

}

.path{

position:absolute;
width:100%;
height:100%;

}

svg{

width:100%;
height:100%;

}

.level{

position:absolute;

width:110px;
height:110px;

border:none;
border-radius:50%;

font-size:40px;

cursor:pointer;

color:white;

transition:.3s;

box-shadow:0 0 25px rgba(0,0,0,.4);

}

.completed{

background:linear-gradient(#FFD700,#FBC02D);

}

.completed:hover{

transform:scale(1.08);

}

.current{

background:linear-gradient(#00C853,#64DD17);

animation:pulse 1.5s infinite;

}

.current:hover{

transform:scale(1.1);

}

.locked{

background:#777;

cursor:not-allowed;

}

@keyframes pulse{

0%{
box-shadow:0 0 10px #00FF00;
}

50%{
box-shadow:0 0 35px #00FF00;
}

100%{
box-shadow:0 0 10px #00FF00;
}

}

/* Button Positions */

#l1{

left:8%;
bottom:12%;

}

#l2{

left:26%;
top:66%;

}

#l3{

left:46%;
top:42%;

}

#l4{

left:66%;
top:60%;

}

#l5{

right:10%;
top:22%;

}


/* Labels */

.label{

position:absolute;

width:140px;

text-align:center;

color:white;

font-weight:bold;

text-shadow:0 0 8px black;

}

.lab1{

left:6%;
bottom:2%;

}

.lab2{

left:24%;
top:82%;

}

.lab3{

left:44%;
top:58%;

}

.lab4{

left:64%;
top:76%;

}

.lab5{

right:8%;
top:38%;

}

.info{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

font-size:20px;

color:white;

text-shadow:0 0 10px black;

}

</style>

</head>

<body>

<div class="title">

⚡ ECOQUEST MAP ⚡

</div>

<div class="subtitle">

Level 4 - Renewable Energy Mission

</div>

<div class="path">

<svg>

<path

d="M120 700
Q260 560 420 500
Q620 350 800 430
Q960 540 1090 250
Q1170 130 1280 80"

stroke="#C8A165"

stroke-width="18"

fill="none"

stroke-linecap="round"

stroke-dasharray="20 15"/>

</svg>

</div>

<button
id="l1"
class="level completed">

✅

</button>

<div class="label lab1">

Green Village
<br>
Completed

</div>

<button
id="l2"
class="level completed">

✅

</button>

<div class="label lab2">

Hydro Dam
<br>
Completed

</div>

<button
id="l3"
class="level completed">

✅

</button>

<div class="label lab3">

Power Station
<br>
Completed

</div>

<button
id="l4"
class="level current"
onclick="location.href='level4.html'">

💨

</button>

<div class="label lab4">

Wind Turbines
<br>
Play

</div>

<button
id="l5"
class="level locked"
onclick="locked()">

🔒

</button>

<div class="label lab5">

Solar Farm

</div>

<button
id="l6"
class="level locked"
onclick="locked()">

🏆

</button>

<div class="label lab6">

Eco Master

</div>

<div class="info">

⚡ Congratulations! You have reached Level 4.<br>
Restore renewable energy sources and continue your journey toward becoming the <b>Eco Master</b>.

</div>

<script>

function locked(){

alert("🔒 Complete the current mission to unlock the next stage.");

}

</script>

</body>
</html>
